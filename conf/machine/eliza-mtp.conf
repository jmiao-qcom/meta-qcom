#@TYPE: Machine
#@NAME: Qualcomm Eliza Mobile Test Platform (MTP)
#@DESCRIPTION: Eliza MTP machine using the MTP device tree and UFS storage.

require conf/machine/include/qcom-eliza.inc

MACHINE_FEATURES += "efi pci"

KERNEL_DEVICETREE ?= " \
    qcom/eliza-mtp.dtb \
"

# Produce the Android-v2 image used by the qualified C1-A boot path. The QLI
# update bundle is opt-in because it needs the local C1 1.5.C1 programmer.
IMAGE_CLASSES += "eliza-mtp-qli-qcomflash"
# Root ADB belongs in the persistent system rootfs. Do not apply its class,
# package and feature to the helper initramfs or ESP image recipes.
IMAGE_CLASSES:append:pn-qcom-multimedia-image = " ${@bb.utils.contains('DEBUG_BUILD', '1', 'image-adbd', '', d)}"
IMAGE_FEATURES:append:pn-qcom-multimedia-image = " ${@bb.utils.contains('DEBUG_BUILD', '1', 'enable-adbd', '', d)}"

QCOM_BOOTIMG_ROOTFS = "PARTLABEL=system_a"
QCOM_BOOTIMG_PAGE_SIZE = "2048"
QCOM_PARTITION_CONF = ""
QCOM_ESP_IMAGE = ""

ELIZA_MTP_QCOMFLASH_ENABLE ?= "0"
ELIZA_MTP_C1_FIREHOSE_DIR ?= ""
ELIZA_MTP_QLI_CMDLINE = "console=ttyMSM0,115200n8 earlycon clk_ignore_unused loglevel=7 ignore_loglevel rdinit=/init module_blacklist=icnss2,qca_cld3_wcn7750 ath12k.debug_mask=0x61 ftrace=tracing_on trace_buf_size=5M trace_event=ath12k:ath12k_wmi_diag:mod:ath12k"
IMAGE_FSTYPES:remove = "${@'qcomflash' if d.getVar('ELIZA_MTP_QCOMFLASH_ENABLE') != '1' else ''}"

# Install WCN7750 firmware, modular ATH12K drivers and debug ADB only in the
# persistent qcom-multimedia-image rootfs.
IMAGE_INSTALL:append:pn-qcom-multimedia-image = " \
    eliza-mtp-wcn7750-firmware \
    eliza-mtp-ath12k-manual-load \
    kernel-module-ath12k \
    kernel-module-ath12k-wifi7 \
    ${@bb.utils.contains('DEBUG_BUILD', '1', 'eliza-mtp-adbd-root-debug', '', d)} \
"
PREFERRED_VERSION_eliza-mtp-wcn7750-firmware = "1.0"

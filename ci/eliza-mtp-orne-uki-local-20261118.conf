# Standalone BitBake override for the current Eliza MTP ORNE UKI + rootfs build.
# This file intentionally has no require/include chain and does not depend on
# prior experiment artifacts. KAS machine/distro/kernel-source settings remain
# in the selected meta-qcom ci/*.yml files.

# Reuse the active default meta-qcom build's downloads and shared state.
DL_DIR = "/local/mnt/workspace/eliza/build/downloads"
SSTATE_DIR = "/local/mnt/workspace/eliza/build/sstate-cache"
BB_NUMBER_THREADS = "2"
PARALLEL_MAKE = "-j4"

# Keep kernel debug support from ci/debug.yml, but do not emit a separate
# debugfs image. Build the UKI for the persistent rootfs partition.
IMAGE_GEN_DEBUGFS = "0"
UKI_FILENAME:pn-esp-qcom-image = "linux-eliza-mtp.efi"
UKI_DEVICETREE:pn-esp-qcom-image = "qcom/eliza-mtp.dtb"
QCOM_BOOTIMG_ROOTFS:pn-esp-qcom-image = "PARTLABEL=rootfs"
UKI_CMDLINE:append:pn-esp-qcom-image = " module_blacklist=icnss2,qca_cld3_wcn7750 ath12k.debug_mask=0x61"

# Keep the WLAN WMI diagnostic trace enabled for the bring-up image.
KERNEL_CMDLINE_EXTRA_FTRACE:pn-esp-qcom-image = "ftrace=tracing_on trace_buf_size=5M trace_event=ath12k:ath12k_wmi_diag:mod:ath12k,printk:console"
